name = "dreamers-on"
main = "src/index.ts"
compatibility_date = "2026-10-22"
nodejs_compat = true

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dreamers-on-db"
database_id = "add6a2d5-a472-4d77-ba38-c7054337d8c2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "dreamers-on-photos"
