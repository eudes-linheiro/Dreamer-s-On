<!doctype html>
<html>
  <head>
    <title>Sign Up</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css_style.css" />
  </head>
  <body style="background: #feaa00;">
    <form action="/submit-form-endpoint" method="POST">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="first-name" placeholder="e.g., John" required>
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="last-name" placeholder="e.g., Doe" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="johndoe@example.com" required>

      <label for="pwd">Password</label>
      <input type="password" id="pwd" name="password" required>
      <label for="pwd">Confirm Password</label>
      <input type="password" id="pwd" name="confirmation" required>

      <button type="submit">Sign Up</button>
      <a href="#">Already have an account</a>
    </form>
  </body>
</html>
