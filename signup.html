<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account</title>
  <link rel="stylesheet" href="css/form.css">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="form-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="education.html">Education</a>
    <a href="arts.html">Arts</a>
    <a href="technology.html">Technology</a>
    <a href="sports.html">Sports</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="signup.html" aria-current="page">Sign up</a>
    <a href="profile.html">Profile</a>
    <a href="account.html">Account</a>
  </nav>

  <main class="login-container">
    <div class="login-card">
      <h1 class="title">Create your account</h1>
      <p class="subtitle">Please enter your details</p>

      <form data-auth-form="register">
        <div class="input-group">
          <input type="text" name="firstName" placeholder="First name" autocomplete="given-name" required>
        </div>

        <div class="input-group">
          <input type="text" name="lastName" placeholder="Last name" autocomplete="family-name" required>
        </div>
        <div class="input-group">
          <input type="text" name="identifier" placeholder="Email or Angola phone (+244)" autocomplete="username" required>
        </div>
        <div class="input-group">
          <input type="password" name="password" placeholder="Password (8 characters minimum)" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
        <div class="input-group">
          <input type="password" name="confirmPassword" placeholder="Confirm password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>

        <p class="form-message" data-auth-message role="status" aria-live="polite"></p>
        <button type="submit" class="btn-primary">Sign up</button>
      </form>
      <p class="signup-footer">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </main>
  <script src="js/auth.js" defer></script>
</body>
</html>
