<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/form.css">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="form-nav" id="main-navigation" aria-label="Main navigation">
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="main-navigation" data-menu-toggle>
      <span></span><span></span><span></span>
    </button>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="profile.html" class="nav-profile-link" aria-label="Your profile" title="Your profile">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" /></svg>
    </a>
  </nav>

  <main class="login-container">
    <div class="login-card">
      <p class="subtitle">Please enter your details</p>
      <h1 class="title">Welcome back</h1>

      <form data-auth-form="login">
        <div class="input-group">
          <input type="text" name="identifier" placeholder="Email or Angola phone (+244)" autocomplete="username" aria-label="Email or Angola phone number" required>
        </div>
        <div class="input-group">
          <input type="password" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
        </div>

        <div class="form-options">
          <a href="forgotpassword.html" class="forgot-link">Forgot your password?</a>
        </div>
        <p class="form-message" data-auth-message role="status" aria-live="polite"></p>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p class="signup-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </main>
  <footer class="form-legal-footer">
    <nav class="legal-links" aria-label="Legal">
      <a href="terms.html">Terms of Use</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </footer>
  <script src="js/auth.js" defer></script>
  <script src="js/navigation.js" defer></script>
</body>
</html>
