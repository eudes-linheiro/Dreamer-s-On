services:
  - type: web
    name: dreamers-on
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: dreamers-on-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_DB_PATH
        value: /var/data/auth.sqlite