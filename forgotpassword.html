<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password </title>
    <link rel="stylesheet" href="css/form.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <nav class="form-nav" id="main-navigation" aria-label="Main navigation">
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="main-navigation" data-menu-toggle>
        <span></span><span></span><span></span>
      </button>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="profile.html" class="nav-profile-link" aria-label="Your profile" title="Your profile">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" /></svg>
      </a>
    </nav>

    <main class="login-container">
      <div class="login-card">
        <h1 class="title">Forgot password</h1>
        <p class="subtitle">Enter the email address or phone number on your account to receive a one-time verification code.</p>
        <form id="recovery-request-form">
          <div class="input-group">
            <input type="text" name="identifier" placeholder="Email or Angola phone (+244)" autocomplete="username" aria-label="Email or Angola phone number" required>
          </div>
          <p class="form-message" data-recovery-message role="status" aria-live="polite"></p>
          <button type="submit" class="btn-primary">Send verification code</button>
        </form>
        <form id="recovery-verify-form" hidden>
          <input type="hidden" name="identifier">
          <div class="input-group">
            <label for="recovery-code">Verification code</label>
            <input id="recovery-code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required>
          </div>
          <div class="input-group">
            <label for="recovery-new-password">New password</label>
            <input id="recovery-new-password" type="password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>
          <div class="input-group">
            <label for="recovery-confirm-password">Confirm new password</label>
            <input id="recovery-confirm-password" type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>
          <p class="form-message" data-recovery-verify-message role="status" aria-live="polite"></p>
          <button type="submit" class="btn-primary">Reset password</button>
        </form>
        <p class="signup-footer" id="recovery-complete" hidden>
          Your password has been reset. <a href="login.html">Sign in</a>
        </p>
        <p class="signup-footer">
          <a href="login.html">Back to the login page</a>
        </p>
      </div>
    </main>
    <footer class="form-legal-footer">
      <nav class="legal-links" aria-label="Legal">
        <a href="terms.html">Terms of Use</a>
        <a href="privacy.html">Privacy Policy</a>
      </nav>
    </footer>
    <script src="js/forgot-password.js" defer></script>
    <script src="js/navigation.js" defer></script>
  </body>
</html>
