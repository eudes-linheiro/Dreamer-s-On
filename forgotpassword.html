<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password </title>
    <link rel="stylesheet" href="css/form.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

    <main class="login-container">
      <div class="login-card">
        <h1 class="title">Forgot password</h1>
        <p class="subtitle">Enter your email associated with your account to receive a password reset information</p>
        <form>
          <div class="input-group">
            <input type="email" placeholder="Email adress" required>
          </div>
          <div class="form-options">
          </div>
          <button type="submit" class="btn-primary">Submit</button>
        </form>
        <p class="signup-footer">
          <a href="login.html">Back to the login page</a>
        </p>
      </div>
    </main>
  </body>
</html>
