<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
    <link rel="stylesheet" href="css/form.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <nav class="form-nav" id="main-navigation" aria-label="Main navigation">
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="main-navigation" data-menu-toggle>
        <span></span><span></span><span></span>
      </button>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="profile.html" class="nav-profile-link" aria-label="Your profile" title="Your profile">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z" /></svg>
      </a>
    </nav>

    <main class="login-container">
      <div class="login-card">
        <h1 class="title">Get in touch</h1>
        <p class="subtitle">Send us a note and we will be in touch.</p>
        <form data-contact-form>
          <div class="input-group">
            <input type="text" name="name" placeholder="Enter your name" autocomplete="name" maxlength="80" required>
          </div>
          <div class="input-group">
            <input type="email" name="email" placeholder="Email address" autocomplete="email" maxlength="254" required>
          </div>
          <div class="input-group">
            <textarea id="message" name="message" rows="4" maxlength="5000" placeholder="Write your message here..." required></textarea>
          </div>
          <p class="form-message" data-contact-message role="status" aria-live="polite"></p>
          <button type="submit" class="btn-primary">Submit</button>
        </form>
        <p class="signup-footer">
          <a href="index.html">Back to the home page</a>
        </p>
      </div>
    </main>
    <footer class="form-legal-footer">
      <nav class="legal-links" aria-label="Legal">
        <a href="terms.html">Terms of Use</a>
        <a href="privacy.html">Privacy Policy</a>
      </nav>
    </footer>
    <script src="js/contact.js" defer></script>
    <script src="js/navigation.js" defer></script>
  </body>
</html>
