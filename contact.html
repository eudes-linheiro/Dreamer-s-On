<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us </title>
    <link rel="stylesheet" href="css/form.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

    <main class="login-container">
      <div class="login-card">
        <h1 class="title">Get in touch</h1>
        <p class="subtitle"></p>
        <form>
          <div class="input-group">
            <input type="text" placeholder="Enter your name" required>
          </div>
          <div class="input-group">
            <input type="email" placeholder="Email adress" required>
          </div>
          <div class="input-group">
            <textarea class="input-group" id=“message” name="message" rows="4" cols="50" placeholder="Write your message here..." required></textarea>
          </div>
          <div class="form-options">
          </div>
          <button type="submit" class="btn-primary">Submit</button>
        </form>
        <p class="signup-footer">
          <a href="index.html">Back to the home page</a>
        </p>
      </div>
    </main>
  </body>
</html>
